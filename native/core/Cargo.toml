[package]
name = "mrenzo-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "mr.enzo shared protocol core: byte-compatible with the React Native client (see docs/native)"
license-file = "../../LICENSE"
publish = false

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
x25519-dalek = "2"
ed25519-dalek = "2"
curve25519-dalek = "4"
salsa20 = "0.10"
poly1305 = "0.8"
hmac = "0.12"
crypto_secretbox = "0.1"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# ML-KEM-768 (FIPS 203) for the hybrid session setup (03 §V3.3.1, wire-1.1 §W6).
# Pre-1.0: pinned exactly; `src/kem.rs` is the only user and calls the
# formally verified PORTABLE instantiation on every target.
libcrux-ml-kem = { version = "=0.0.10", default-features = false, features = ["mlkem768"] }

[dev-dependencies]
hex = "0.4"
